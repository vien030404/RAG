# ============================================================================
# Hạ tầng cho pipeline cào tin và hỏi-đáp RAG.
#
#   Crawler   ->  MinIO (bucket raw + warehouse)  <-  Iceberg REST Catalog
#   Postgres  ->  metadata dùng chung cho Iceberg catalog và Airflow
#   Qdrant    ->  vector store
#   Trino     ->  truy vấn SQL trên Iceberg
#   Airflow   ->  điều phối
#
# Mọi tham số cấu hình nằm trong .env, tạo bằng cách sao chép .env.example.
# ============================================================================

# ---------------------------------------------------------------------------
# Khối cấu hình Airflow dùng chung cho scheduler và webserver (LocalExecutor)
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION}
  image: airflow:${AIRFLOW_VERSION}
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    # Thông tin kết nối tới các thành phần dữ liệu, DAG đọc qua biến môi trường
    LAKEHOUSE_S3_ENDPOINT: http://minio:9000
    LAKEHOUSE_ICEBERG_REST_URI: http://iceberg-rest:8181
    LAKEHOUSE_ICEBERG_WAREHOUSE: s3://${MINIO_WAREHOUSE_BUCKET}/
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_REGION: ${AWS_REGION}
    LAKEHOUSE_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-project-1}_lakehouse
    # Tham số RAG: DAG truyền tiếp xuống container của task `embed`
    LAKEHOUSE_QDRANT_URL: http://qdrant:6333
    QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    QDRANT_COLLECTION: ${QDRANT_COLLECTION:-news_chunks}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
    GEMINI_KEY_COOLDOWN: ${GEMINI_KEY_COOLDOWN:-60}
    GEMINI_TPM_LIMIT: ${GEMINI_TPM_LIMIT:-30000}
    GEMINI_TPM_SAFETY: ${GEMINI_TPM_SAFETY:-0.8}
    GEMINI_RPM_LIMIT: ${GEMINI_RPM_LIMIT:-100}
    EMBED_BATCH: ${EMBED_BATCH:-40}
    GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
    EMBED_DIM: ${EMBED_DIM:-768}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    # Cho DockerOperator khởi chạy crawler như một sibling container.
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - lakehouse

services:
  # =========================================================================
  # Kho metadata dùng chung: một Postgres, hai database riêng
  # =========================================================================
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # được ./postgres/init/01-create-databases.sh đọc khi khởi tạo
      ICEBERG_CATALOG_DB: ${ICEBERG_CATALOG_DB}
      ICEBERG_CATALOG_USER: ${ICEBERG_CATALOG_USER}
      ICEBERG_CATALOG_PASSWORD: ${ICEBERG_CATALOG_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse
    restart: unless-stopped

  # =========================================================================
  # Object store tương thích S3: chứa cả HTML thô và warehouse của Iceberg
  # =========================================================================
  minio:
    image: minio/minio:${MINIO_VERSION}
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${AWS_REGION}
    ports:
      - "${MINIO_API_PORT}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT}:9001"  # giao diện web
    volumes:
      - minio-data:/data
    networks:
      - lakehouse
    restart: unless-stopped

  # Job một lần: tạo các bucket ngay khi MinIO sẵn sàng rồi tự kết thúc.
  minio-init:
    image: minio/mc:${MINIO_MC_VERSION}
    container_name: minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_WAREHOUSE_BUCKET: ${MINIO_WAREHOUSE_BUCKET}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO to be ready..."; sleep 2;
        done
        for b in "$$MINIO_WAREHOUSE_BUCKET" "$$MINIO_RAW_BUCKET"; do
          mc mb --ignore-existing local/"$$b"
          echo "Bucket ready: $$b"
        done
    networks:
      - lakehouse
    restart: "no"

  # =========================================================================
  # Iceberg REST Catalog: metadata lưu ở Postgres qua JDBC, dữ liệu ở MinIO
  # =========================================================================
  iceberg-rest:
    build:
      context: ./iceberg-rest
      args:
        ICEBERG_REST_VERSION: ${ICEBERG_REST_VERSION}
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
    image: iceberg-rest:${ICEBERG_REST_VERSION}
    container_name: iceberg-rest
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      CATALOG_WAREHOUSE: s3://${MINIO_WAREHOUSE_BUCKET}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/${ICEBERG_CATALOG_DB}
      CATALOG_JDBC_USER: ${ICEBERG_CATALOG_USER}
      CATALOG_JDBC_PASSWORD: ${ICEBERG_CATALOG_PASSWORD}
    ports:
      - "${ICEBERG_REST_PORT}:8181"
    networks:
      - lakehouse
    restart: unless-stopped

  # =========================================================================
  # Vector store: embedding của từng chunk bài báo, kèm payload để lọc
  # =========================================================================
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION}
    container_name: qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "${QDRANT_HTTP_PORT}:6333"   # REST + dashboard (/dashboard)
      - "${QDRANT_GRPC_PORT}:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Image không có curl hay wget, nên kiểm tra bằng cách mở TCP socket.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lakehouse
    restart: unless-stopped

  # =========================================================================
  # Engine SQL trên Iceberg. Đọc cùng catalog và cùng bucket với pipeline Python,
  # và là nơi duy nhất chạy được các thủ tục bảo trì bảng mà PyIceberg không có:
  # optimize, expire_snapshots, remove_orphan_files.
  #
  #   CLI:   docker compose exec trino trino --catalog iceberg --schema bronze
  #   JDBC:  jdbc:trino://localhost:8080  (chưa bật xác thực)
  # =========================================================================
  trino:
    image: trinodb/trino:${TRINO_VERSION}
    container_name: trino
    depends_on:
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      # trino/etc/catalog/iceberg.properties đọc hai biến này qua ${ENV:...}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./trino/etc:/etc/trino:ro
      - trino-data:/data/trino
    ports:
      - "${TRINO_PORT}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/v1/info').status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lakehouse
    restart: unless-stopped

  # =========================================================================
  # Crawler: cào báo rồi ghi vào Iceberg Bronze.
  #
  # Job chạy một lần, nằm sau một profile nên `docker compose up` không khởi
  # động nó. Chạy khi cần:
  #
  #   docker compose run --rm --no-deps crawler
  # =========================================================================
  crawler:
    build:
      context: ./crawler
    image: crawler:0.1
    container_name: crawler
    profiles: ["crawler"]
    depends_on:
      iceberg-rest:
        condition: service_started
    environment:
      # Iceberg REST catalog và warehouse trên MinIO (bảng Bronze)
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://${MINIO_WAREHOUSE_BUCKET}/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      BRONZE_NAMESPACE: bronze
      BRONZE_TABLE: articles
      # Tầng RAG: chunk, embed rồi ghi sang Qdrant
      #   docker compose run --rm crawler -m newscrawler.embed
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-news_chunks}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_KEY_COOLDOWN: ${GEMINI_KEY_COOLDOWN:-60}
      GEMINI_TPM_LIMIT: ${GEMINI_TPM_LIMIT:-30000}
      GEMINI_TPM_SAFETY: ${GEMINI_TPM_SAFETY:-0.8}
      GEMINI_RPM_LIMIT: ${GEMINI_RPM_LIMIT:-100}
      EMBED_BATCH: ${EMBED_BATCH:-40}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-flash-latest}
      EMBED_DIM: ${EMBED_DIM:-768}
      # Bucket chứa HTML gốc đã nén gzip — object thường, không phải bảng Iceberg
      RAW_BUCKET: ${MINIO_RAW_BUCKET}
      # Thu hẹp phạm vi cào, đều không bắt buộc. Mặc định: mọi nguồn, mọi
      # chuyên mục, ngày hôm trước.
      #   CRAWL_SOURCES: "vnexpress,tuoitre"        # tên nguồn, phẩy ngăn cách
      #   CRAWL_CATEGORIES: "Kinh doanh,Thế giới"   # tên chuyên mục, phẩy ngăn cách
      #   CRAWL_DATE: "2026-07-02"                  # ngày dạng ISO, hoặc "all"
    networks:
      - lakehouse
    restart: "no"

  # =========================================================================
  # Giao diện hỏi-đáp bằng Streamlit, dùng chung image với crawler.
  #   docker compose --profile chat up -d chatbot   ->  http://localhost:8501
  # =========================================================================
  chatbot:
    image: crawler:0.1
    container_name: chatbot
    profiles: ["chat"]
    depends_on:
      qdrant:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    # ENTRYPOINT của image là `python`, nên chỉ cần truyền phần đối số còn lại.
    command:
      - -m
      - streamlit
      - run
      - chat_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://${MINIO_WAREHOUSE_BUCKET}/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      BRONZE_NAMESPACE: bronze
      BRONZE_TABLE: articles
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-news_chunks}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_KEY_COOLDOWN: ${GEMINI_KEY_COOLDOWN:-60}
      GEMINI_TPM_LIMIT: ${GEMINI_TPM_LIMIT:-30000}
      GEMINI_TPM_SAFETY: ${GEMINI_TPM_SAFETY:-0.8}
      GEMINI_RPM_LIMIT: ${GEMINI_RPM_LIMIT:-100}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-flash-latest}
      EMBED_DIM: ${EMBED_DIM:-768}
      ASK_TOP_K: ${ASK_TOP_K:-8}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    networks:
      - lakehouse
    restart: unless-stopped

  # =========================================================================
  # Điều phối bằng Airflow với LocalExecutor
  # =========================================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg-data:
  minio-data:
  qdrant-data:
  trino-data:

networks:
  lakehouse:
    driver: bridge
