connector.name=iceberg

# Cùng Iceberg REST catalog và cùng bucket MinIO mà pipeline Python dùng, nên
# Trino đọc đúng dữ liệu đó mà không cần bản sao nào.
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/

# Lớp S3 gốc của Trino, trỏ vào MinIO.
# Khoá truy cập đọc từ biến môi trường của container qua ${ENV:...}, nhờ vậy
# luôn khớp giá trị trong .env và không phải sửa file này.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
