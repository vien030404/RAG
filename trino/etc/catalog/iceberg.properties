connector.name=iceberg

# Use the shared Iceberg REST catalog (same catalog as dbt / bronze-silver-gold)
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/

# Native S3 filesystem pointed at MinIO.
# Credentials are read from the container environment (${ENV:...}) so they
# stay in sync with the values in .env - no need to edit this file.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
