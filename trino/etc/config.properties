# Triển khai một node: coordinator đồng thời đóng vai worker. Quy mô dữ liệu của
# dự án không cần tới cụm nhiều node.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Giới hạn bộ nhớ cho mỗi truy vấn. Điều chỉnh theo RAM của máy chạy, và luôn
# giữ dưới mức -Xmx khai báo trong jvm.config.
query.max-memory=1GB
query.max-memory-per-node=1GB
